spring.application.name=mcp_server
# local MCP servers should only listen on localhost
server.address=127.0.0.1
server.port=8080

# reported to clients as serverInfo
mcp.server.name=${spring.application.name}
mcp.server.version=0.0.1-SNAPSHOT
# notes file the tools operate on, relative to the working directory (run the server from the repo root)
mcp.database-path=data/db
# browser Origins allowed to call the server, to prevent DNS rebinding attacks
mcp.allowed-origin-hosts=localhost,127.0.0.1,[::1]
